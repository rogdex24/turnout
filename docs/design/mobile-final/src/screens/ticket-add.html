<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnout, Add your BookMyShow ticket</title>
<meta name="description" content="Add your BookMyShow ticket (needs_ticket): screenshot only, an empty picker, a block sample of what the screenshot should show, Choose screenshot.">
<!-- @head -->
<style>
.scroll{position:absolute;top:96px;left:0;right:0;bottom:150px;overflow:hidden;padding:4px 20px 0}
.scroll.d1{bottom:98px}
.scroll .lead{margin-top:8px;color:var(--muted)}
.stack>*+*{margin-top:16px}
.stack>h2+.lead{margin-top:8px}
/* Neutral screenshot mock made of blocks: no brand, no real screenshot. */
.mock{width:64px;height:112px;border-radius:10px;background:var(--s2);border:1px solid var(--line);padding:8px 7px;display:flex;flex-direction:column;gap:5px;flex:none}
.mock i{display:block;height:5px;border-radius:2px;background:var(--line)}
.mock .pic{height:28px;border-radius:4px}
.mock .k{background:var(--outline)}
.mock .gap{background:transparent;border:1px dashed var(--outline);height:7px}
.mock.lg{width:92px;height:150px;padding:10px 9px;gap:7px;border-radius:12px}
.mock.lg i{height:7px}
.mock.lg .pic{height:36px}
.pick{min-height:132px;border-radius:16px;border:1.5px dashed var(--outline);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;width:100%}
.pick i{font-size:32px}
.sample{display:flex;gap:16px;align-items:center;padding:16px}
.sample ul{display:flex;flex-direction:column;gap:10px}
.sample li{display:flex;align-items:center;gap:8px;font-size:15px;line-height:20px}
.sample li::before{content:"";width:14px;height:5px;border-radius:2px;background:var(--outline);flex:none}
.sample .t-meta{margin-bottom:10px}
.del{display:flex;align-items:center;gap:8px}
.del i{font-size:18px}
.shot{display:flex;gap:14px;align-items:center;padding:12px}
.shot .tx{flex:1;min-width:0}
.shot .tx b{display:block;font-size:15px;line-height:20px;font-weight:600}
.shot .t-meta{margin-top:2px}
.sent{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;font-weight:600;margin-top:6px}
.sent i{font-size:16px}
.ask{padding:16px}
.ask .acts{display:flex;gap:8px;margin-top:12px;align-items:center}
.ask .btn2{width:auto;flex:1}
.ask .btn3{flex:1}
.dock .btn3{display:flex;margin:4px auto 0}
.note b{display:block;font-weight:600}
</style>
</head>
<body>
<div class="frame" data-component-id="frame">
<!-- @status 9:41 -->
<header class="navbar">
  <a href="#" class="iconbtn" data-component-id="back" aria-label="Back"><i class="ph ph-caret-left" aria-hidden="true"></i></a>
  <h1>Traffic Jam Tales</h1>
  <span class="spacer" aria-hidden="true"></span>
</header>
<main class="scroll stack">
  <h2 class="t-display">Add your BookMyShow ticket</h2>
  <p class="lead t-body">A screenshot of your BookMyShow booking. JPEG, PNG or HEIC.</p>
  <button class="pick" data-component-id="pick-screenshot" aria-label="Choose screenshot from your photos">
    <i class="ph ph-image" aria-hidden="true"></i>
    <span class="t-title">No screenshot yet</span>
    <span class="t-meta">Pick one from your photos</span>
  </button>
  <div class="card sample" data-component-id="screenshot-sample">
    <div class="mock lg" aria-hidden="true"><i class="pic"></i><i class="k" style="width:85%"></i><i class="k" style="width:60%"></i><i style="width:90%"></i><i style="width:75%"></i><i class="k" style="width:45%"></i><i style="width:70%"></i></div>
    <div>
      <p class="t-meta">It should show</p>
      <ul>
        <li>The show</li>
        <li>The date and time</li>
        <li>How many seats</li>
      </ul>
    </div>
  </div>
  <p class="t-meta del"><i class="ph ph-trash" aria-hidden="true"></i>We delete it after the show</p>
</main>
<div class="dock">
  <button class="btn" data-component-id="choose-screenshot">Choose screenshot</button>
  <button class="btn3" data-component-id="later">I'll do it later</button>
</div>
<!-- @gesture -->
</div>
</body>
</html>
