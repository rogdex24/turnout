<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnout, Enter the code</title>
<meta name="description" content="Sign in, code from WhatsApp: six code boxes with three digits in and the fourth in focus, Change number, Paste, and Send again after 60 seconds.">
<!-- @head -->
<style>
.scroll{position:absolute;top:96px;left:0;right:0;bottom:256px;overflow:hidden;padding:4px 20px 0}
.scroll .lead{margin-top:8px;color:var(--muted)}
.scroll .link{margin-top:2px}
/* Code boxes: display numerals, fixed size */
.code{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:20px}
.code span{height:64px;border-radius:14px;border:1px solid var(--outline);background:var(--s1);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:36px;line-height:1}
.code span.focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.code span.focus::after{content:"";width:2px;height:30px;background:var(--ink)}
.acts{display:flex;align-items:center;justify-content:space-between;margin:16px -12px 0 0}
.again{display:flex;align-items:center}
.again .btn3{padding:0 12px 0 8px}
.btn3 i{font-size:20px}
.keys{position:absolute;left:0;right:0;bottom:0;height:256px;background:var(--s1);border-top:1px solid var(--line);padding:8px 6px 0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:46px;gap:7px 6px;z-index:21}
.keys span{border-radius:8px;background:var(--s2);display:grid;place-items:center;font-size:24px;line-height:1}
.keys span.blank{background:transparent}
.keys span i{font-size:24px}
</style>
</head>
<body>
<div class="frame" data-component-id="frame">
<!-- @status 9:41 -->
<header class="navbar">
  <a href="#" class="iconbtn" data-component-id="back" aria-label="Back"><i class="ph ph-caret-left" aria-hidden="true"></i></a>
  <h1></h1>
  <span class="spacer" aria-hidden="true"></span>
</header>
<main class="scroll">
  <h2 class="t-display">Enter the code</h2>
  <p class="lead t-body tnum">Sent on WhatsApp to +91 55501 00123</p>
  <a href="#" class="link" data-component-id="change-number">Change number</a>
  <div class="code tnum" role="group" aria-label="6 digit code, 3 of 6 entered" data-component-id="code-field">
    <span>4</span><span>8</span><span>1</span><span class="focus" aria-hidden="true"></span><span></span><span></span>
  </div>
  <div class="acts">
    <p class="again t-body"><span class="muted">Not there yet?</span><button class="btn3" data-component-id="send-again">Send again</button></p>
    <button class="btn3" data-component-id="paste-code"><i class="ph ph-clipboard-text" aria-hidden="true"></i>Paste</button>
  </div>
</main>
<div class="keys" aria-hidden="true">
  <span>1</span><span>2</span><span>3</span>
  <span>4</span><span>5</span><span>6</span>
  <span>7</span><span>8</span><span>9</span>
  <span class="blank"></span><span>0</span><span class="blank"><i class="ph ph-backspace"></i></span>
</div>
<!-- @gesture -->
</div>
</body>
</html>
