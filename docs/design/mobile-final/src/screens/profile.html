<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnout, Your profile</title>
<meta name="description" content="Profile form after the notice and consent: photo, first name, gender chips, Instagram or LinkedIn handle with why we ask, the women and non-binary groups toggle, and Save.">
<!-- @head -->
<style>
.scroll{position:absolute;top:96px;left:0;right:0;bottom:98px;overflow:hidden;padding:0 20px}
.stack>*+*{margin-top:20px}
.photo{display:flex;align-items:center;gap:16px}
.photo .face{width:96px;height:96px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
/* Toggle row and switch (local, to move into base.css) */
.toggle{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.toggle .tx{flex:1;min-width:0}
.toggle .tx b{display:block;font-size:15px;line-height:20px;font-weight:600}
.toggle .tx span{display:block;font-size:13px;line-height:18px;color:var(--muted);margin-top:2px}
.switch{width:51px;height:31px;border-radius:999px;background:var(--s2);border:1px solid var(--outline);position:relative;flex:none;margin:-6px 0 -7px;box-sizing:content-box;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:99px;background:var(--muted);transition:transform var(--press) var(--ease)}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"]::after{background:var(--bg);transform:translateX(20px)}
.switchhit{min-width:51px;min-height:44px;display:grid;place-items:center;margin:-7px -4px -7px 0;flex:none}
</style>
</head>
<body>
<div class="frame" data-component-id="frame">
<!-- @status 9:41 -->
<header class="navbar">
  <a href="#" class="iconbtn" data-component-id="back" aria-label="Back"><i class="ph ph-caret-left" aria-hidden="true"></i></a>
  <h1>Your profile</h1>
  <span class="spacer" aria-hidden="true"></span>
</header>
<main class="scroll stack">
  <p class="t-meta">First name and photo are what your group sees.</p>
  <div class="photo">
    <div class="face"><img src="img/face-you.jpg" alt="Your photo"></div>
    <a href="#" class="link" data-component-id="change-photo">Change photo</a>
  </div>
  <div>
    <p class="label" id="name-label">First name</p>
    <div class="field" role="textbox" aria-labelledby="name-label" tabindex="0" data-component-id="first-name">Ananya</div>
  </div>
  <div>
    <p class="label" id="gender-label">Gender</p>
    <div class="chips" role="group" aria-labelledby="gender-label">
      <button class="chip" aria-pressed="true" data-component-id="gender-woman">Woman</button>
      <button class="chip" aria-pressed="false" data-component-id="gender-man">Man</button>
      <button class="chip" aria-pressed="false" data-component-id="gender-nonbinary">Non-binary</button>
    </div>
  </div>
  <div>
    <p class="label" id="handle-label">Instagram or LinkedIn</p>
    <div class="field" role="textbox" aria-labelledby="handle-label" aria-describedby="handle-help" tabindex="0" data-component-id="social-handle">@ananya.k</div>
    <p class="help" id="handle-help">So we can check you're a real person. Others in your group never see it.</p>
  </div>
  <div class="card toggle">
    <div class="tx" id="wo-label"><b>Women and non-binary groups only</b><span>Only women and non-binary people who chose this.</span></div>
    <span class="switchhit"><button class="switch" role="switch" aria-checked="false" aria-labelledby="wo-label" data-component-id="women-only"></button></span>
  </div>
</main>
<div class="dock">
  <button class="btn" data-component-id="save">Save</button>
</div>
<!-- @gesture -->
</div>
</body>
</html>
