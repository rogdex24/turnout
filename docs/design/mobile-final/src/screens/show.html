<!doctype html>

<style>
.hero{position:absolute;top:0;left:0;right:0;height:336px;padding:96px 20px 22px;display:flex;flex-direction:column;justify-content:flex-end}
.hero h1{font-size:70px;line-height:.86;max-width:330px}
.hero .cat-line{font-size:15px;line-height:20px;margin-top:10px}
.back{position:absolute;top:48px;left:12px;z-index:20}

.facts{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 14px}
.facts b{display:block;font-size:15px;line-height:20px;font-weight:600}
.facts .where{font-size:13px;line-height:18px;color:var(--muted)}
.price{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;text-align:right;white-space:nowrap}

.buy{padding:12px 14px 14px}

      <p class="price tnum"><small>From</small>₹499</p>
    </div>
    <div class="perf" aria-hidden="true"></div>
    <div class="buy">

    <h2 class="t-title" id="how-h">How it works</h2>
    <p class="t-body">Add your BookMyShow ticket. See your group 3 hours before. Meet at a cafe, go in together.</p>
