# Git hooks (lefthook). Installed by `bun install` through the prepare script.
# They run in every worktree of this repo: hooks live in the shared .git directory.
# Skip once with LEFTHOOK=0 only when you know why; CI will run the same checks.

pre-commit:
  # check-server: types (six projects), lint, DESIGN.md lint, unit tests, dependency rules, run side by side (package.json).
  # check-mobile: the app's ESLint (React Compiler and Expo env rules) and Jest. It runs only when a file under apps/mobile or packages, or the root package.json, is staged.
  jobs:
    - name: format staged files
      glob: "*.{ts,tsx,js,json,css}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    # The format job runs first and alone, because it rewrites and restages files the checks read. The checks then run
    # side by side: each is a separate process, and the commit waits for the slowest one instead of the sum.
    - group:
        parallel: true
        jobs:
          - name: check-server
            run: bun run check:server
          - name: check-mobile
            glob:
              - "apps/mobile/**"
              - "packages/**"
              - "package.json"
            run: bun run check:mobile
          - name: gitleaks-staged
            run: gitleaks git --staged --redact --no-banner

pre-push:
  jobs:
    - name: browser tests
      run: bun run e2e
