[install]
# One flat node_modules, as before the workspaces. Expo and Metro expect hoisted packages.
linker = "hoisted"
# Refuse versions published in the last 14 days (seconds). Renovate uses the same age.
minimumReleaseAge = 1209600

[serve.static]
plugins = ["bun-plugin-tailwind"]

[test]
# e2e/*.spec.ts belong to Playwright (bun run e2e), not bun test.
root = "test"
