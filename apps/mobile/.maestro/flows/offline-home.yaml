# A signed-in member loses the connection: Home keeps the shows it saved and says it is offline, a cold start without a connection
# opens on the saved shows, and a refresh after the connection comes back clears the notice. Written for CI.
# Maestro can turn on airplane mode only on Android, so the offline part runs there. On iOS the flow only checks that Home loads.
appId: com.turnout.app.e2e
name: offline-home
tags:
  - offline
env:
  MATCHABLE_MEMBER: "+12025550104"
---
- runFlow:
    file: ../subflows/sign-in-seed.yaml
    env:
      PHONE: ${MATCHABLE_MEMBER}
      SERVER_URL: ${SERVER_URL}
      TEST_TOKEN: ${TEST_TOKEN}

- assertVisible:
    id: "show-card-.*"
- assertNotVisible: "You're offline. Showing what we saved."

- runFlow:
    when:
      platform: Android
    commands:
      # A pull to refresh with no connection fails in the transport, so the app marks itself offline and keeps the saved list.
      - setAirplaneMode: enabled
      - retry:
          maxRetries: 2
          commands:
            - swipe:
                start: 50%, 35%
                end: 50%, 85%
            - extendedWaitUntil:
                visible: "You're offline. Showing what we saved."
                timeout: 10000
      - assertVisible:
          id: "show-card-.*"

      # A cold start reads the shows from the disk cache. The first request fails, so the notice comes back.
      - stopApp
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible:
            id: home
          timeout: 20000
      - assertVisible:
          id: "show-card-.*"
      - extendedWaitUntil:
          visible: "You're offline. Showing what we saved."
          timeout: 15000

      # The connection comes back. The radio can take a few seconds, so the refresh runs again until a request gets through.
      - setAirplaneMode: disabled
      - retry:
          maxRetries: 3
          commands:
            - swipe:
                start: 50%, 35%
                end: 50%, 85%
            - extendedWaitUntil:
                notVisible: "You're offline. Showing what we saved."
                timeout: 10000
      - assertVisible:
          id: "show-card-.*"
