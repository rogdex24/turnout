# A fresh install walks the Welcome cards with the Next button, reads and agrees to the notice, signs in a new seeded member with the
# code from the server's test route, and fills the profile form up to the photo. Written for CI; it has not run on a device yet.
# The system photo picker is not scripted: choosing a picture needs a device-specific picker, so the flow checks that Save asks
# for the photo and stops there (the photo path is covered by the Jest tests for the profile screen).
appId: com.turnout.app.e2e
name: onboarding
tags:
  - onboarding
env:
  NEW_MEMBER: "+12025550101"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome
    timeout: 30000
# On iOS the trust line is only part of the card's label, so match it anywhere in the text.
- assertVisible: ".*Everyone signs in with a phone number, a real photo and a social profile we check.*"
- assertVisible: ".*1 of 3"
- tapOn:
    id: welcome-next
- assertVisible: ".*2 of 3"
- swipe:
    direction: LEFT
- assertVisible: ".*3 of 3"
- assertVisible: "Get started"
- tapOn:
    id: welcome-next
- extendedWaitUntil:
    visible:
      id: notice
    timeout: 10000
# The notice shows the grievance officer's block from the server, and Agree waits for it.
- assertVisible: "How we use your details"
- extendedWaitUntil:
    notVisible: "Loading the grievance officer's details"
    timeout: 15000
- tapOn:
    id: agree
- extendedWaitUntil:
    visible:
      id: sign-in
    timeout: 10000

# Sign in as a member with nothing on the account yet.
- runFlow:
    file: ../subflows/send-code.yaml
    env:
      PHONE: ${NEW_MEMBER}
- extendedWaitUntil:
    visible:
      id: code
    timeout: 10000
- runScript:
    file: ../scripts/otp-code.js
    env:
      SERVER_URL: ${SERVER_URL}
      TEST_TOKEN: ${TEST_TOKEN}
      PHONE: ${NEW_MEMBER}
- runFlow:
    file: ../subflows/enter-code.yaml
    env:
      CODE: ${output.code}
- extendedWaitUntil:
    visible:
      id: profile
    timeout: 15000

# Save with nothing filled says what is missing, next to each field.
- tapOn:
    id: save
- assertVisible: "Enter your first name."
- assertVisible: "Choose one."
- assertVisible: "Add a photo of your face to continue."
- assertVisible: "Add your Instagram or LinkedIn."

# The women-only switch appears for women and goes away for men. The error lines make the form longer than a small screen, and the
# keyboard covers the lower half, so the flow closes the keyboard and scrolls to each control before it uses it.
- tapOn:
    id: first-name
- inputText: "Ananya"
# hideKeyboard fails on some iOS keyboards. A single-line field blurs on submit, so the return key closes the keyboard instead.
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: gender-woman
    direction: DOWN
    centerElement: true
- tapOn:
    id: gender-woman
- scrollUntilVisible:
    element:
      id: women-only
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      id: gender-man
    direction: UP
    centerElement: true
- tapOn:
    id: gender-man
- assertNotVisible:
    id: women-only
- tapOn:
    id: gender-woman
- scrollUntilVisible:
    element:
      id: handle
    direction: DOWN
    centerElement: true
- tapOn:
    id: handle
- inputText: "https://www.instagram.com/ananya.k/"
- pressKey: Enter
- scrollUntilVisible:
    element: "So we can check you're a real person. Others in your group never see it."
    direction: DOWN
    centerElement: true
- tapOn:
    id: save
- scrollUntilVisible:
    element: "Add a photo of your face to continue."
    direction: UP
