# The meet card, from a push to "I'm here". Signs in as a member of the seed's live group (scripts/seed-staging.ts, Lata), opens the
# card the way a tap on the "Meet your group" push does (the e2e build's own link, turnout-e2e://push), then checks what the card
# draws, moves the device to the cafe, and checks in.
#
# The seed's live show starts 75 minutes after the server starts, so check-in (T-90m to T+60m) is open on the phone's own clock and
# the server's for about two hours. config.yaml runs this flow before any flow moves the server's clock.
# Maestro's setLocation is the same as `adb emu geo fix <lng> <lat>`; the cafe is at 17.4435, 78.3772.
# The e2e build has no Maps key, so the card draws the static map. The real map needs a Play-signed phone and is checked by hand.
appId: com.turnout.app.e2e
name: loop-meet
tags:
  - loop
env:
  MEET_MEMBER: "+12025550114"
  EVENT_ID: seed-show-meet-live
---
- runFlow:
    file: ../subflows/sign-in-seed.yaml
    env:
      PHONE: ${MEET_MEMBER}
      SERVER_URL: ${SERVER_URL}
      TEST_TOKEN: ${TEST_TOKEN}

# The location permission is granted up front, so the card goes straight to the walk line instead of the system dialog.
- launchApp:
    clearState: false
    permissions:
      location: allow

# The plan's id and its meet card notice come from the server: the seed makes both with fresh ids on every run, and the app reads
# the group from the notice, so a made-up notice id opens the plan instead of the card.
- runFlow:
    file: ../subflows/operator.yaml
    env:
      SERVER_URL: ${SERVER_URL}
      TEST_TOKEN: ${TEST_TOKEN}
      ROUTE: plan
      PHONE: ${MEET_MEMBER}
      EVENT_ID: ${EVENT_ID}
      DECISION: ""
      REASON: ""
      PHONES: ""
      TEXT: ""

# The push for a live meet card opens the card.
- runFlow:
    file: ../subflows/open-link-to.yaml
    env:
      LINK: turnout-e2e://push?kind=meet_card_live&noticeId=${output.noticeId}&planId=${output.planId}
      SCREEN: meet

# The card draws the meet time, the cafe with its map and the group. The e2e build shows the static map.
- assertVisible:
    id: meet-time
- assertVisible:
    id: meet-place
- assertVisible:
    id: meet-map-static
- assertNotVisible:
    id: meet-map
- assertVisible:
    id: meet-group
- assertVisible:
    id: meet-open-maps

# Members show a first name and a photo, and nothing else: no handle, no number.
- assertNotVisible: ".*@.*"
- assertNotVisible: ".*\\+\\d{6,}.*"

# The phone is away from the cafe, then at it. The position stays on the phone: the line is drawn here, from the phone's own fix.
- setLocation:
    latitude: 17.4525
    longitude: 78.3811
- extendedWaitUntil:
    visible: ".*min walk to .*"
    timeout: 20000
- setLocation:
    latitude: 17.4435
    longitude: 78.3772
- extendedWaitUntil:
    visible: ".*at the cafe.*"
    timeout: 20000

# The Safety sheet puts Call 112 first and can be closed.
- tapOn:
    id: meet-safety
- assertVisible:
    id: safety-call
- tapOn: Close
- assertNotVisible:
    id: safety-call

# I'm here checks the person in and the button says so. The press plays the moment (a Success haptic on the phone).
- tapOn:
    id: meet-here
- extendedWaitUntil:
    visible: ".*checked in.*"
    timeout: 15000
