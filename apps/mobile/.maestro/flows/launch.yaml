# The first flow: a fresh install opens and shows the Welcome screen, because nobody is signed in.
appId: com.turnout.app.e2e
name: launch
tags:
  - launch
---
- launchApp:
    clearState: true
# A slow emulator can show "Pixel Launcher isn't responding" over the app on first boot. Wait lets the launcher recover.
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible:
      id: welcome
    timeout: 30000
# iOS reads each welcome card as one element whose label leaves out the wordmark, so the flow looks for the first card, not the word Turnout.
- assertVisible:
    id: welcome-card-1
