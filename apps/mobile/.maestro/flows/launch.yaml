# The first flow: a fresh install opens and shows the home screen.
# Today that is the placeholder home. When the Welcome screen lands in M2, change the assertion to its heading.
appId: com.turnout.app.e2e
name: launch
tags:
  - launch
---
- launchApp:
    clearState: true
# A slow emulator can show "Pixel Launcher isn't responding" over the app on first boot. Wait lets the launcher recover.
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible:
      id: home
    timeout: 30000
- assertVisible: "Turnout"
