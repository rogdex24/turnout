# Opens one Storybook story in the e2e build and photographs it. One run, one shot.
# Run by path with these variables (the device job also sets the theme and the text size on the device first):
#   maestro test --test-output-dir /tmp/out -e STORY_ID=screens-home--loaded -e READY_TEXT="Shows coming up" \
#     apps/mobile/.maestro/visual/capture-story.yaml
# Maestro 2 keeps screenshots inside its output folder, so the shot lands at <out>/<flow>/takeScreenshot/capture.png.
# ci/device-run.sh moves it to $SHOT_DIR/<story>/<theme>-<text>.png, the baseline layout in docs/plans/mobile-visual-testing.md.
appId: com.turnout.app.e2e
name: capture story
tags:
  - visual
---
- launchApp:
    clearState: true
# A link sent while the app is still starting is lost (the router is not listening yet), and the app stays on Welcome.
- extendedWaitUntil:
    visible:
      id: welcome
    timeout: 30000
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: turnout-e2e://storybook?story=${STORY_ID}&device=1
# On iOS a text inside an element that is accessible as a whole, such as the poster, is only part of that element's name.
- extendedWaitUntil:
    visible: ".*${READY_TEXT}.*"
    timeout: 30000
- waitForAnimationToEnd
# Android shows a screen's scroll bar after layout and fades it out about half a second later.
# waitForAnimationToEnd treats the thin bar as no change, so the shot caught the bar on some runs and not on others.
# This wait for a text that never shows is a fixed 2 s pause; optional lets the flow go on after the timeout.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "visual capture pause, never on screen"
          timeout: 2000
          optional: true
- takeScreenshot: capture
