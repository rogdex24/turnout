# A fresh install to the phone step: Skip on Welcome, then accept the notice. Run with runFlow from the flows that sign in.
appId: com.turnout.app.e2e
name: open sign-in
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome
    timeout: 30000
- tapOn:
    id: welcome-skip
- extendedWaitUntil:
    visible:
      id: notice
    timeout: 10000
- tapOn:
    id: notice-accept
- extendedWaitUntil:
    visible:
      id: sign-in
    timeout: 10000
