# A fresh install signed in as a seeded member, ending on the Shows tab. Run with runFlow and PHONE, SERVER_URL and TEST_TOKEN.
appId: com.turnout.app.e2e
name: sign in seed
---
- runFlow: open-sign-in.yaml
# Flows sign the same members in again within minutes, faster than the server's per-number limit allows a person.
- runScript:
    file: ../scripts/reset-limits.js
    env:
      SERVER_URL: ${SERVER_URL}
      TEST_TOKEN: ${TEST_TOKEN}
- runFlow:
    file: send-code.yaml
    env:
      PHONE: ${PHONE}
- extendedWaitUntil:
    visible:
      id: code
    timeout: 10000
- runScript:
    file: ../scripts/otp-code.js
    env:
      SERVER_URL: ${SERVER_URL}
      TEST_TOKEN: ${TEST_TOKEN}
      PHONE: ${PHONE}
- runFlow:
    file: enter-code.yaml
    env:
      CODE: ${output.code}
- extendedWaitUntil:
    visible:
      id: home
    timeout: 20000
# Once on iOS a show link opened while Home was still sliding in was dropped, and the app stayed on Home.
- waitForAnimationToEnd
