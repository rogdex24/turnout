# Maestro workspace config. Run from apps/mobile: `maestro test .maestro` runs the flows in flows/.
# The visual capture flow in visual/ is run by path, one story at a time (see visual/README.md).
flows:
  - "flows/*.yaml"
# loop-meet, thread and report need the seed's meet_card_live plan and group rows, which M3 adds. Remove this line when they are in.
excludeTags:
  - needs-group-seed
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - launch
    - smoke
    - onboarding
    - otp-errors
    - browse
    - deeplink-show
    - push-routing
    - loop-join
    - ticket-rejected
    - cancel
    - profile-check
    - loop-group
    - loop-no-group
    - group-shrinks
    - thread
    - report
    - after-show
