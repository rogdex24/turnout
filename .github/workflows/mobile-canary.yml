name: mobile-canary

# Weekly cold builds. ci.yml reuses native builds by fingerprint, so a build that no longer works from scratch (a moved
# toolchain, a yanked dependency, a runner image change) would go unseen until a cache miss. This builds both e2e apps with no
# native cache and runs expo-doctor. It reads no secrets and does not use EXPO_TOKEN. A red run is a signal to look, not a gate.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-canary
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.3"
  XCODE_VERSION: "26.2"

jobs:
  doctor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: expo-doctor
        working-directory: apps/mobile
        run: bunx expo-doctor
      - name: Expo packages match the SDK
        working-directory: apps/mobile
        run: bunx expo install --check

  android-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install --frozen-lockfile
      - name: Build the e2e APK with no caches
        run: apps/mobile/ci/build-android.sh

  ios-cold:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - run: bun install --frozen-lockfile
      - name: Build the e2e simulator app with no caches
        run: apps/mobile/ci/build-ios.sh
