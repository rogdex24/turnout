name: ci

# Server, web and mobile CI.
# Rules for this file:
#   - pull_request only, never pull_request_target, and no repository secrets in PR jobs.
#   - Every action is pinned by full commit SHA with the version in a comment.
#   - Required status checks should list only `ci-gate`, so jobs can be added or skipped without editing branch protection.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One group per PR, or per ref for pushes. Only PR runs cancel each other: a push to main always finishes, because the next
# push scans only its own commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.3"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  MAESTRO_VERSION: "2.11.0"
  # sha256 of the maestro.zip of the cli-2.11.0 release, taken from a download on 2026-10-27. The release page has no checksums file.
  MAESTRO_SHA256: "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a"
  # Pinned so the simulator and the build do not change under a green run. Change both together, and the cache key follows.
  XCODE_VERSION: "26.2"
  IOS_RUNTIME: "com.apple.CoreSimulator.SimRuntime.iOS-26-2"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'src/**'
              - 'e2e/**'
              - 'data/**'
              - 'test/fixtures/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/**'
              - 'src/**'
              - 'e2e/**'
              - 'data/**'
              - 'scripts/visual-*.ts'
              - '.gitattributes'
              - '.lfsconfig'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The binary is downloaded and checked against a pinned checksum. gitleaks-action is not used.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dl="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$dl/gitleaks.tgz" "$url"
          echo "${GITLEAKS_SHA256}  $dl/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$dl/gitleaks.tgz" -C "$dl" gitleaks
          sudo install -m 0755 "$dl/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      # Scan the commits this event adds, not all history. Old history is cleaned once by the approved rewrite
      # (docs/plans/public-repo-audit.md); until then a full scan would fail every PR on a value no PR can remove.
      # Run the full scan by hand with `gitleaks git --redact --log-opts="--all" .` after the rewrite.
      - name: Scan new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A missing, all-zero or unknown BASE (a first push, or a force-push such as the history rewrite) scans all of
          # HEAD's history. gitleaks exits 0 with "0 commits scanned" on a bad range, so the range is checked first and
          # any ERR line from gitleaks fails the step.
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$HEAD"
          else
            range="$HEAD"
          fi
          echo "Scanning $(git rev-list --count "$range") commits in $range"
          gitleaks git --redact --no-banner --no-color --log-opts="$range" . 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          if grep -q " ERR " "$RUNNER_TEMP/gitleaks.log"; then
            echo "gitleaks reported an error" >&2
            exit 1
          fi
      - name: Scan working tree
        run: gitleaks dir --redact --no-banner .

  e2e-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: node_modules/.bin/playwright install --with-deps chromium
      - run: bun run e2e

  # Mobile jobs. They run only when the `mobile` filter matches and read no secrets. `check` above already runs `bun run check`,
  # which includes the mobile half (typecheck, Biome, ESLint, dependency-cruiser and Jest), so there is no separate mobile check job.
  #
  # The native e2e builds are cached by the Expo fingerprint of the project. A cache hit puts the current JS into the cached build
  # with @expo/repack-app (apps/mobile/ci/repack.sh); a miss builds from scratch (apps/mobile/ci/build-*.sh).
  # The device jobs run the Maestro flows and the visual capture (apps/mobile/.maestro/ci/device-run.sh) against the seeded server.
  # None of this has run on a GitHub runner yet: see docs/plans/mobile-accounts.md ("First CI run").

  mobile-health:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: expo-doctor
        working-directory: apps/mobile
        run: bunx expo-doctor@1.21.5
      - name: Expo packages match the SDK
        working-directory: apps/mobile
        run: bunx expo install --check

  build-android:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install --frozen-lockfile
      # Taken before prebuild: once android/ exists it becomes part of the fingerprint.
      - name: Fingerprint
        id: fingerprint
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          source ci/env.sh
          echo "hash=$(bunx fingerprint fingerprint:generate --platform android | jq -r .hash)" >> "$GITHUB_OUTPUT"
      - name: Native build cache
        id: native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mobile/build/e2e.apk
          key: android-e2e-${{ steps.fingerprint.outputs.hash }}
      - name: Gradle cache
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build the e2e APK
        if: steps.native.outputs.cache-hit != 'true'
        run: apps/mobile/ci/build-android.sh
      - name: Repack the cached APK with the current JS
        if: steps.native.outputs.cache-hit == 'true'
        run: apps/mobile/ci/repack.sh android
      - name: Collect the APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${{ steps.native.outputs.cache-hit }}" = "true" ]; then
            cp build/e2e-repacked.apk out/e2e.apk
          else
            cp build/e2e.apk out/e2e.apk
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-e2e-apk
          path: apps/mobile/out/e2e.apk
          retention-days: 3
          if-no-files-found: error

  build-ios:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - run: bun install --frozen-lockfile
      - name: Fingerprint
        id: fingerprint
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          source ci/env.sh
          echo "hash=$(bunx fingerprint fingerprint:generate --platform ios | jq -r .hash)" >> "$GITHUB_OUTPUT"
      - name: Native build cache
        id: native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mobile/build/e2e-ios.tgz
          key: ios-e2e-signed-xcode${{ env.XCODE_VERSION }}-${{ steps.fingerprint.outputs.hash }}
      - name: Build the e2e simulator app
        if: steps.native.outputs.cache-hit != 'true'
        run: apps/mobile/ci/build-ios.sh
      - name: Repack the cached app with the current JS
        if: steps.native.outputs.cache-hit == 'true'
        run: apps/mobile/ci/repack.sh ios
      - name: Collect the app
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${{ steps.native.outputs.cache-hit }}" = "true" ]; then
            cp build/e2e-ios-repacked.tgz out/e2e-ios.tgz
          else
            cp build/e2e-ios.tgz out/e2e-ios.tgz
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-e2e-app
          path: apps/mobile/out/e2e-ios.tgz
          retention-days: 3
          if-no-files-found: error

  # android-small and android-large. `name` makes each run show as its target.
  android-device:
    name: ${{ matrix.target }}
    needs: build-android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 360 dp wide: device-run.sh sets 720x1520 at 320 dpi on top of this profile.
          - target: android-small
            profile: pixel_6
          # The runner's avdmanager has no pixel_9_pro_xl profile. pixel_7_pro is the same large-phone class (6.7 inch, 1440x3120).
          - target: android-large
            profile: pixel_7_pro
    env:
      SERVER_URL: http://localhost:3917
      SHOT_DIR: ${{ github.workspace }}/visual-shots/${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install --frozen-lockfile
      - name: Fetch this target's baselines from LFS
        run: git -c lfs.fetchexclude= lfs pull --include="apps/mobile/.maestro/visual/baselines/${{ matrix.target }}/**"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-e2e-apk
          path: apk
      - name: Install Maestro
        run: apps/mobile/.maestro/ci/install-maestro.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the seeded server
        run: |
          MOBILE_SERVER_PORT=3917 bun e2e/mobile-server.ts > "$RUNNER_TEMP/mobile-server.log" 2>&1 &
          # The server prints the token only after it answers, so the wait is for the token line, not for the first answer: reading
          # the log as soon as curl succeeds can find no token, and every flow that reads a sign-in code then gets a 404.
          # macOS runners have no `timeout`, so the wait is a bounded loop. The curl and the test fail the step if either is missing.
          for _ in $(seq 90); do grep -q '^STAGING_TEST_TOKEN=' "$RUNNER_TEMP/mobile-server.log" && break; sleep 1; done
          curl -sf "http://localhost:3917/api/events?limit=1" > /dev/null
          token="$(sed -n 's/^STAGING_TEST_TOKEN=//p' "$RUNNER_TEMP/mobile-server.log")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "TEST_TOKEN=$token" >> "$GITHUB_ENV"
      # `script` runs one line at a time. The second line is the one automatic re-run; a flow that needs it often is fixed or
      # quarantined that week (docs/plans/mobile-ci-budget.md).
      - name: Run the flows and the visual capture
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apk/e2e.apk
            apps/mobile/.maestro/ci/device-run.sh ${{ matrix.target }} || apps/mobile/.maestro/ci/device-run.sh ${{ matrix.target }}
      - name: Compare the shots with the baselines
        run: apps/mobile/.maestro/ci/visual-compare.sh "${{ matrix.target }}"
      - name: Upload the shots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-shots-${{ matrix.target }}
          path: visual-shots/${{ matrix.target }}
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload the diff report and the server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-${{ matrix.target }}
          path: |
            visual-diff-report/${{ matrix.target }}
            ${{ runner.temp }}/mobile-server.log
            ~/.maestro/tests
          retention-days: 7
          if-no-files-found: ignore

  # ios-small and ios-large.
  ios-device:
    name: ${{ matrix.target }}
    needs: build-ios
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ios-small
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation
          - target: ios-large
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max
    env:
      SERVER_URL: http://localhost:3917
      SHOT_DIR: ${{ github.workspace }}/visual-shots/${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - run: bun install --frozen-lockfile
      - name: Fetch this target's baselines from LFS
        run: git -c lfs.fetchexclude= lfs pull --include="apps/mobile/.maestro/visual/baselines/${{ matrix.target }}/**"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-e2e-app
          path: app
      - name: Install Maestro
        run: apps/mobile/.maestro/ci/install-maestro.sh
      - name: Boot the simulator and install the app
        env:
          DEVICE_TYPE: ${{ matrix.device_type }}
        run: |
          set -euo pipefail
          udid="$(xcrun simctl create "${{ matrix.target }}" "$DEVICE_TYPE" "$IOS_RUNTIME")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          mkdir -p app/unpacked
          tar -xzf app/e2e-ios.tgz -C app/unpacked
          xcrun simctl install "$udid" app/unpacked/*.app
      - name: Start the seeded server
        run: |
          MOBILE_SERVER_PORT=3917 bun e2e/mobile-server.ts > "$RUNNER_TEMP/mobile-server.log" 2>&1 &
          # The server prints the token only after it answers, so the wait is for the token line, not for the first answer: reading
          # the log as soon as curl succeeds can find no token, and every flow that reads a sign-in code then gets a 404.
          # macOS runners have no `timeout`, so the wait is a bounded loop. The curl and the test fail the step if either is missing.
          for _ in $(seq 90); do grep -q '^STAGING_TEST_TOKEN=' "$RUNNER_TEMP/mobile-server.log" && break; sleep 1; done
          curl -sf "http://localhost:3917/api/events?limit=1" > /dev/null
          token="$(sed -n 's/^STAGING_TEST_TOKEN=//p' "$RUNNER_TEMP/mobile-server.log")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "TEST_TOKEN=$token" >> "$GITHUB_ENV"
      # The second command is the one automatic re-run (see the Android job).
      - name: Run the flows and the visual capture
        run: |
          apps/mobile/.maestro/ci/device-run.sh "${{ matrix.target }}" || apps/mobile/.maestro/ci/device-run.sh "${{ matrix.target }}"
      - name: Compare the shots with the baselines
        run: apps/mobile/.maestro/ci/visual-compare.sh "${{ matrix.target }}"
      - name: Upload the shots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-shots-${{ matrix.target }}
          path: visual-shots/${{ matrix.target }}
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload the diff report and the server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-${{ matrix.target }}
          path: |
            visual-diff-report/${{ matrix.target }}
            ${{ runner.temp }}/mobile-server.log
            ~/.maestro/tests
          retention-days: 7
          if-no-files-found: ignore

  # The one required check. It passes when every needed job passed or was skipped, and fails otherwise
  # (failure, cancelled). `if: always()` makes it run, and report, even when a needed job failed.
  ci-gate:
    needs: [changes, check, secrets, e2e-web, mobile-health, build-android, build-ios, android-device, ios-device]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every needed job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success|skipped) ;;
              *) echo "a needed job ended as: $r"; exit 1 ;;
            esac
          done
